name: Android builds

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      production-signed: ${{ steps.signing.outputs.configured }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.8'
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Configure Android signing
        id: signing
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.BLOCKADE_KEYSTORE_BASE64 }}
        run: |
          if [[ -z "$KEYSTORE_BASE64" ]]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          umask 077
          keystore="$RUNNER_TEMP/blockade-release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore"
          echo "BLOCKADE_KEYSTORE_PATH=$keystore" >> "$GITHUB_ENV"
          echo "configured=true" >> "$GITHUB_OUTPUT"
      - name: Build APK and AAB
        shell: bash
        env:
          BLOCKADE_STORE_PASSWORD: ${{ steps.signing.outputs.configured == 'true' && secrets.BLOCKADE_STORE_PASSWORD || '' }}
          BLOCKADE_KEY_ALIAS: ${{ steps.signing.outputs.configured == 'true' && secrets.BLOCKADE_KEY_ALIAS || '' }}
          BLOCKADE_KEY_PASSWORD: ${{ steps.signing.outputs.configured == 'true' && secrets.BLOCKADE_KEY_PASSWORD || '' }}
        run: |
          flutter build apk --release --build-number "$GITHUB_RUN_NUMBER"
          flutter build appbundle --release --build-number "$GITHUB_RUN_NUMBER"
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/Blockade.apk
          cp build/app/outputs/bundle/release/app-release.aab dist/Blockade.aab
      - uses: actions/upload-artifact@v4
        with:
          name: blockade-android
          path: dist/
          if-no-files-found: error
          overwrite: true

  release:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: blockade-release-${{ github.run_number }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: blockade-android
          path: dist
      - name: Publish both Android files
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCTION_SIGNED: ${{ needs.build.outputs.production-signed }}
        run: |
          tag="android-$GITHUB_RUN_NUMBER"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $tag already exists."
            exit 0
          fi
          notes="Android build from commit $GITHUB_SHA."
          if [[ "$PRODUCTION_SIGNED" != true ]]; then
            notes="$notes Test build with debug signing. Use the same production signing key for install-over updates and Play uploads."
          fi
          gh release create "$tag" dist/Blockade.apk dist/Blockade.aab \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Blockade Android build $GITHUB_RUN_NUMBER" \
            --notes "$notes"
